server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The document names the content-hashed bundles, so a cached copy pins the
    # browser to an old release. try_files above internally redirects here, so
    # this applies to every route.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes everything under /assets — those URLs never change
    # meaning, so they are safe to freeze for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Unhashed static files (favicon, icons). Cacheable but revalidated:
    # "immutable" here would strand a changed icon for the full TTL.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}

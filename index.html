<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Looply — Circular Route Planner</title>
    <meta name="description" content="Generate circular running and cycling routes from any starting point." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#030712" />
    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Looply" />
    <link rel="apple-touch-icon" href="/icon-512.svg" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts. Inter is a progressive enhancement: index.css falls back to
         system-ui, so a blocked or slow Google Fonts still renders correctly.
         Leaflet's CSS is NOT loaded here — it is imported in main.jsx so it
         ships in the bundle, pinned to the version in package-lock.json,
         instead of being fetched from a CDN at runtime. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- The service worker is registered from the app (utils/swUpdate.js) so
         update detection can drive the refresh UI. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

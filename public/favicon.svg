<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Looply mark: a loop one step from closing, start dot at the top.
       Bolder stroke than the in-app mark (LooplyMark.jsx) so the gap stays
       legible at 16px tab size. Dash + gap must sum to 2*PI*20 = 125.66. -->
  <g transform="rotate(-90 32 32)">
    <circle cx="32" cy="32" r="20" stroke="#a3e635" stroke-width="8" stroke-linecap="round" stroke-dasharray="100.5 25.2"/>
  </g>
  <circle cx="32" cy="12" r="6" fill="#a3e635"/>
</svg>

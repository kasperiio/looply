<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed square, not a rounded rect: the manifest declares this icon
       "maskable", so the platform applies its own shape and anything outside
       the central 80% safe zone may be cropped. The mark spans ~282px,
       comfortably inside the 409px safe circle. -->
  <rect width="512" height="512" fill="#030712"/>
  <g transform="translate(64, 64) scale(6)" fill="none">
    <g transform="rotate(-90 32 32)">
      <circle cx="32" cy="32" r="20" stroke="#a3e635" stroke-width="7" stroke-linecap="round" stroke-dasharray="101.7 24"/>
    </g>
    <circle cx="32" cy="12" r="5" fill="#a3e635"/>
  </g>
</svg>
